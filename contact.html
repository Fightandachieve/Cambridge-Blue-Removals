<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Cambridge Blue Removals</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-site-header></div><main>
<section class="page-hero"><div class="container"><span class="eyebrow" style="color:#8ad0ff">Reach out</span><h1>Contact Cambridge Blue Removals</h1><p class="lead">Call, WhatsApp, email or send an enquiry.</p></div></section>
<section class="section"><div class="container contact-grid">
<div><div class="contact-list"><div class="contact-item"><strong>Phone</strong><br><a data-phone-link href="#"><span data-phone></span></a></div><div class="contact-item"><strong>Email</strong><br><a data-email-link href="#"><span data-email></span></a></div><div class="contact-item"><strong>Address</strong><br><span data-address></span></div><div class="contact-item"><strong>Opening hours</strong><br>Mon–Sat: <span data-hours-monsat></span><br>Sun: <span data-hours-sun></span></div></div><div class="map-box" id="contactMap" style="margin-top:20px"></div></div>
<form class="quote-form" id="contactForm"><h2>Send an enquiry</h2><div class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Moving date</label><input name="moving date" type="date"></div><div class="field full"><label>Message</label><textarea name="message" rows="7" placeholder="Tell us about your move"></textarea></div></div><label class="checkline" style="margin-top:14px"><input type="checkbox" name="quote by WhatsApp"> I would like to receive my quote by WhatsApp</label><div style="margin-top:20px"><button class="btn btn-primary">Send Enquiry</button></div><p id="contactMessage" class="small" style="margin-top:12px"></p></form>
</div></section></main><div data-site-footer></div><script src="assets/js/config.js"></script><script src="assets/js/site.js"></script><script src="assets/js/contact.js"></script></body></html>
